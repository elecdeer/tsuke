packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@base-ui/react": ^1.5.0
  "@valibot/to-json-schema": ^1.7.1
  "@vitejs/plugin-react": ^6.0.2
  "@vitest/browser-playwright": 5.0.5
  clsx: ^2.1.1
  date-fns: ^4.4.0
  jotai: ^2.20.1
  lucide-react: ^1.18.0
  msw: ^2.13.6
  msw-storybook-addon: ^2.0.7
  react-day-picker: ^10.0.1
  typescript: ^6.0.3
  valibot: ^1.3.1
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vitest-browser-react: ^2.2.0
  vite-plus: 1.4.0
  void: 1.2.1
  "@void/react": 1.2.1
  csv-parse: 7.0.3
  drizzle-orm: 0.45.4
  maplibre-gl: ^6.16.0
  fake-indexeddb: ^6.2.6
  "@tanstack/charts": 1.4.0
  agents: ^0.33.0
  ai: ^7.0.170
  "@eslint/css": ^2.0.1
  eslint: ^10.14.0
  eslint-plugin-css-cev: ^0.1.1
  eslint-plugin-css-properties-order: ^0.0.1
  jiti: ^2.7.0
  temporal-polyfill-lite: ^1.0.1

catalogMode: prefer
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true
  spawn-sync: false
  core-js-pure: false
