packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@base-ui/react": ^1.5.0
  "@valibot/to-json-schema": ^1.7.1
  "@vitejs/plugin-react": ^6.0.2
  "@vitest/browser-playwright": 5.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  date-fns: ^4.4.0
  jotai: ^2.20.1
  lucide-react: ^1.18.0
  msw: ^2.13.6
  msw-storybook-addon: ^2.0.7
  react-day-picker: ^10.0.1
  shadcn: ^4.11.0
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  valibot: ^1.3.1
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vitest-browser-react: ^2.2.0
  vite-plus: 1.4.0
  void: 1.2.1
  "@void/react": 1.2.1
  csv-parse: 7.0.3
  drizzle-orm: 0.45.4
  "@tailwindcss/vite": ^4.2.4
  tailwindcss: ^4.2.4
  leaflet: ^1.9.4
  "@types/leaflet": ^1.9.22
  fake-indexeddb: ^6.2.6

catalogMode: prefer
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true
  spawn-sync: false
  lefthook: set this to true or false
